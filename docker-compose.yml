services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=agency_backend.settings
      - DEBUG=True
      - DATABASE_URL=postgres://agency_user:agency_password@db:5432/agency_db
    volumes:
      - ./backend:/app
    depends_on:
      - db
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - API_PROXY_TARGET=http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  db:
    image: postgres:13
    environment:
      - POSTGRES_DB=agency_db
      - POSTGRES_USER=agency_user
      - POSTGRES_PASSWORD=agency_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
